name: Release

# Cut a release by pushing a tag:
#   git tag v0.0.1 && git push origin v0.0.1
# This builds the am binary for Linux and macOS and attaches the files to a
# GitHub release, ready to download and drop into a bin folder.
#
# The same builds also run on every pull request, so a change that breaks a
# release build is caught in review rather than at tagging time. Pull
# requests only build (the binaries are attached to the run as downloadable
# artifacts); publishing a release happens on tags alone.
#
# macOS builds are signed with a Developer ID certificate and notarized when
# the signing secrets are configured; see "Signing the macOS builds" in the
# README. Without those secrets the build still succeeds and simply produces
# unsigned binaries, so forks and pull requests are unaffected.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs on every event so `build` never gets skipped by a skipped
  # dependency; the check itself only applies to tag pushes.
  verify:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag with package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match the version in Cargo.toml ($version)."
            echo "Set version = \"${TAG#v}\" in Cargo.toml and commit it, or tag v$version instead."
            exit 1
          fi
          echo "Tag $TAG matches Cargo.toml version $version."

  build:
    name: Build ${{ matrix.artifact }}
    needs: verify
    runs-on: ${{ matrix.os }}
    # Generous next to a slow notary queue, far below the 6-hour default
    # that let a stuck step run all morning.
    timeout-minutes: 120
    # Job-level env so the `if:` on each signing step can test whether the
    # secrets exist. Secrets are empty strings on forks and pull requests.
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
      MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
      AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
      # How long to wait on Apple's notary queue. Minutes are normal, but the
      # queue has no SLA and occasionally runs far longer. Override with the
      # NOTARY_TIMEOUT repository variable.
      NOTARY_TIMEOUT: ${{ vars.NOTARY_TIMEOUT || '45m' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl build: one file that runs on any x86_64 Linux,
          # regardless of glibc version.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: am-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: am-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: am-macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/am" dist/am

      # Signing happens before packaging so both the tarball and the bare
      # binary carry the signature. The signature lives inside the Mach-O
      # file, so copying and archiving preserve it.
      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          # Random password: this keychain lives and dies with the runner.
          keychain_password="$(uuidgen)"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

          printf '%s' "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # Every tool that will touch the private key must be named here.
          # pkgbuild missing from this list does not fail — it waits forever
          # on a password prompt that a headless runner can never answer.
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild -T /usr/bin/productsign
          # A separate Developer ID *Installer* certificate signs the .pkg.
          # Skip this when both certificates live in the same .p12.
          if [ -n "$MACOS_INSTALLER_CERT_P12" ]; then
            printf '%s' "$MACOS_INSTALLER_CERT_P12" | base64 -d > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" -k "$keychain" \
              -P "$MACOS_INSTALLER_CERT_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/pkgbuild
            rm -f "$RUNNER_TEMP/installer.p12"
          fi
          # Lets the signing tools use the keys without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        run: |
          set -euo pipefail
          # Referring to the identity by its SHA-1 is unambiguous even when
          # the keychain holds several certificates. MACOS_SIGNING_IDENTITY
          # overrides the lookup when it is set.
          identity="$MACOS_SIGNING_IDENTITY"
          if [ -z "$identity" ]; then
            identity=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | awk '/Developer ID Application/ { print $2; exit }')
          fi
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity in the keychain."
            exit 1
          fi
          # --options runtime (the hardened runtime) and a secure timestamp
          # are both required for notarization to succeed.
          codesign --force --options runtime --timestamp --sign "$identity" dist/am
          codesign --verify --strict --verbose=2 dist/am

      # Notarization calls out to Apple and takes minutes, so it runs for
      # tags only. Pull requests still sign, which catches certificate
      # problems without queueing a submission on every push.
      # A .p8 is a text file, so the secret plausibly holds either the key
      # itself or base64 of it. Accept both: feeding a raw PEM through
      # base64 -d yields garbage and notarytool reports only
      # `Error: invalidPEMDocument`, which says nothing about the cause.
      - name: Prepare the notarization key
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && env.MACOS_CERT_P12 != '' && env.AC_API_KEY_P8 != ''
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/ac-api-key.p8"
          if printf '%s' "$AC_API_KEY_P8" | grep -q -- '-----BEGIN'; then
            printf '%s\n' "$AC_API_KEY_P8" > "$key"
          else
            printf '%s' "$AC_API_KEY_P8" | base64 -d > "$key" 2>/dev/null || true
          fi
          if ! grep -q -- '-----BEGIN' "$key" 2>/dev/null; then
            echo "::error::AC_API_KEY_P8 is neither an App Store Connect .p8 key nor base64 of one. Re-add it with: base64 -i AuthKey_XXXXXXXXXX.p8 | gh secret set AC_API_KEY_P8"
            exit 1
          fi
          echo "NOTARY_KEY=$key" >> "$GITHUB_ENV"

      - name: Notarize the binary
        if: runner.os == 'macOS' && env.NOTARY_KEY != ''
        run: |
          set -uo pipefail
          # notarytool takes .zip, .pkg or .dmg, so submit a zip of the
          # binary. What gets notarized is the signature inside it.
          ditto -c -k dist/am "$RUNNER_TEMP/notarize.zip"
          log="$RUNNER_TEMP/notarize-binary.log"
          status=0
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$NOTARY_KEY" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait --timeout "$NOTARY_TIMEOUT" 2>&1 | tee "$log" || status=$?
          rm -f "$RUNNER_TEMP/notarize.zip"
          id=$(grep -m1 -Eo '[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}' "$log" || true)

          if [ "$status" -eq 0 ]; then
            echo "Binary notarized."
          elif [ "$status" -eq 124 ]; then
            # Waiting timed out; the submission is still queued at Apple. The
            # binary is signed either way, and its ticket is fetched online at
            # first run, so it becomes valid once Apple finishes. Losing the
            # whole release over a slow queue would be worse.
            echo "::warning::Notarization did not finish within $NOTARY_TIMEOUT. Submission ${id:-unknown} is still processing; the signed binary ships regardless and becomes notarized when Apple completes it. Check with: xcrun notarytool info ${id:-<id>}"
          else
            # Anything else is a rejection or a credential problem, which
            # shipping past would be dishonest.
            echo "::error::Notarization failed (exit $status)."
            [ -n "$id" ] && xcrun notarytool log "$id" \
              --key "$NOTARY_KEY" --key-id "$AC_API_KEY_ID" \
              --issuer "$AC_API_ISSUER_ID" || true
            exit 1
          fi
          # A lone executable has nowhere to store a notarization ticket, so
          # it cannot be stapled and Gatekeeper checks Apple online the first
          # time it runs. The .pkg below covers the offline case.

      - name: Build and sign the installer package
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        # The .pkg is a bonus artifact, so it gets a short leash and is
        # allowed to fail: the binaries, tarballs and release still go out.
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -euo pipefail
          # Installer identities are not codesigning identities, so they may
          # not show up under the default policy.
          find_installer() {
            security find-identity -v "$KEYCHAIN_PATH" \
              | awk '/Developer ID Installer/ { print $2; exit }'
          }
          identity=$(find_installer)
          if [ -z "$identity" ]; then
            identity=$(security find-identity -v -p basic "$KEYCHAIN_PATH" \
              | awk '/Developer ID Installer/ { print $2; exit }')
          fi
          if [ -z "$identity" ]; then
            echo "::notice::No Developer ID Installer certificate found; skipping the .pkg."
            exit 0
          fi
          # Cargo.toml rather than the tag: pull-request runs have no tag, and
          # the verify job already proves the two agree on a tag push.
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          pkg="dist/${{ matrix.artifact }}.pkg"
          mkdir -p pkgroot
          install -m 755 dist/am pkgroot/am
          pkgbuild --root pkgroot --install-location /usr/local/bin \
            --identifier com.benjatech.am --version "$version" \
            --sign "$identity" "$pkg"
          pkgutil --check-signature "$pkg"
          echo "PKG=$pkg" >> "$GITHUB_ENV"

      # Unlike a bare executable, a .pkg can carry its notarization ticket,
      # so stapling makes it verify without a network round trip.
      - name: Notarize and staple the installer package
        if: runner.os == 'macOS' && env.PKG != '' && env.NOTARY_KEY != ''
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/notarize-pkg.log"
          status=0
          xcrun notarytool submit "$PKG" \
            --key "$NOTARY_KEY" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait --timeout "$NOTARY_TIMEOUT" 2>&1 | tee "$log" || status=$?
          id=$(grep -m1 -Eo '[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}' "$log" || true)

          if [ "$status" -ne 0 ]; then
            # Unlike the binary, an unstapled .pkg has no fallback worth
            # shipping, so drop it and let the release go out without one.
            echo "::warning::Notarization of $PKG did not complete (exit $status, submission ${id:-unknown}); leaving the .pkg out of this release. The binaries and tarballs are unaffected."
            rm -f "$PKG"
            echo "PKG=" >> "$GITHUB_ENV"
            exit 0
          fi

          xcrun stapler staple "$PKG"
          xcrun stapler validate "$PKG"
          # Confirms Gatekeeper accepts the installer as distributed.
          spctl --assess --type install -vvv "$PKG"

      - name: Package
        run: |
          set -euo pipefail
          # COPYFILE_DISABLE stops bsdtar on macOS from adding ._ metadata
          # files next to the binary inside the archive.
          COPYFILE_DISABLE=1 tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C dist am
          mv dist/am "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # A glob because the .pkg only exists when the macOS signing
          # secrets are configured.
          path: dist/*
          if-no-files-found: error

      - name: Remove signing credentials
        if: always() && runner.os == 'macOS'
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "${NOTARY_KEY:-}" || true

  release:
    name: Publish GitHub release
    needs: build
    # Only tags publish; pull-request runs stop after the build job.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # Tags carrying a suffix (v1.0.0-rc.1) are published as prereleases.
          extra=""
          case "$TAG" in *-*) extra="--prerelease" ;; esac
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # Re-running a tag refreshes the assets of the existing release.
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist/* \
              --repo "$REPO" \
              --title "am $TAG" \
              --generate-notes $extra
          fi

  homebrew:
    name: Update Homebrew tap
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Every step is skipped when no tap token is configured, so the job is a
    # no-op until you opt in.
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # `brew tap benjatech/alias-management` resolves to this repository:
      # Homebrew requires the `homebrew-` prefix and strips it in the tap name.
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'benjatech/homebrew-alias-management' }}
    steps:
      - uses: actions/checkout@v4
        if: env.TAP_TOKEN != ''

      - uses: actions/download-artifact@v4
        if: env.TAP_TOKEN != ''
        with:
          path: dist
          merge-multiple: true

      - name: Render and push the formula
        if: env.TAP_TOKEN != ''
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/$REPO/releases/download/$TAG"
          sha() { sha256sum "dist/$1.tar.gz" | cut -d' ' -f1; }

          # `brew audit` wants a license. Guessing one would be worse than
          # leaving it out, so the line appears only once Cargo.toml has it.
          license=$(grep -m1 '^license = ' Cargo.toml | cut -d'"' -f2 || true)
          if [ -z "$license" ]; then
            echo "::warning::No license field in Cargo.toml, so the formula omits it and \`brew audit\` will object."
          fi

          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/$TAP_REPO" tap
          mkdir -p tap/Formula

          {
            echo "# Generated by the release workflow in $REPO. Do not edit by hand."
            echo "class Am < Formula"
            echo "  desc \"Manage personal bash aliases stored in ~/.alias-management\""
            echo "  homepage \"https://github.com/$REPO\""
            echo "  version \"$version\""
            [ -n "$license" ] && echo "  license \"$license\""
            cat <<FORMULA

            on_macos do
              on_arm do
                url "$base/am-macos-arm64.tar.gz"
                sha256 "$(sha am-macos-arm64)"
              end
              on_intel do
                url "$base/am-macos-x86_64.tar.gz"
                sha256 "$(sha am-macos-x86_64)"
              end
            end

            on_linux do
              on_intel do
                url "$base/am-linux-x86_64.tar.gz"
                sha256 "$(sha am-linux-x86_64)"
              end
            end

            def install
              bin.install "am"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/am --version")
            end
          end
          FORMULA
          } > tap/Formula/am.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/am.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "am $version"
            git push
          fi
